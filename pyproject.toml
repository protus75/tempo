[project]
name = "tempo-agents"
version = "0.1.0"
description = "Runs tickets against a host repo with agents in the VS Code chat of Claude Code, Codex, and Copilot."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[project.scripts]
tempo = "tempo.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tempo"]

# An allowlist: an untracked file (such as .claude/ notes) must never ship in the sdist.
[tool.hatch.build.targets.sdist]
include = ["/tempo", "/README.md", "/pyproject.toml"]
