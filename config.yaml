# Instance config (host plane, TEMPO_PLAN.md section 15). Operator-owned: edit between runs.
schema_version: 1
state_dir: .tempo/state
# Subagent models per host (AGENT_PLAN.md section 4.4.2). Review is pinned to each host's strongest
# model, which never appears in models_by_tier: a model never reviews its own work.
hosts:
  claude:
    models_by_tier: {low: claude-sonnet-5-5, medium: claude-sonnet-5-5, high: claude-sonnet-5-5, max: claude-sonnet-5-5}
    pins: {review: claude-opus-5-5}
    quota_window_minutes: 60
  codex:
    models_by_tier: {low: gpt-6-luna, medium: gpt-6.1-sol, high: gpt-6.1-sol, max: gpt-6.1-sol}
    pins: {review: gpt-6-astra}
    quota_window_minutes: 60
  # copilot:                       # fill in model ids to enable Copilot; checked like the others
  #   models_by_tier: {low: <id>, medium: <id>, high: <id>, max: <id>}
  #   pins: {review: <id>}
  #   quota_window_minutes: 60
orchestrator:
  models: {claude: claude-opus-5-5, codex: gpt-6-astra}   # copilot added after the P4c live gate
  session:
    max_tickets: 5                 # tickets started before the session hands off
    max_minutes: 240               # tools refuse new work after this; the session hands off
review: {}
merge: {}
tickets:
  max_minutes: 180  # raised from the shipped 90 to admit longer ticket stuck budgets (section 18)
engine_plane_safety_inventory: [specs/, tempo/gates.py, tempo/config.py, tempo/providers.py, config.yaml]
